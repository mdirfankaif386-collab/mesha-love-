<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(45deg, #ff4e50, #fc913a);
    color: white;
    overflow: hidden;
}

.container {
    margin-top: 20%;
}

h1 {
    font-size: 40px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.yes {
    background-color: #00ff88;
    color: black;
}

.no {
    background-color: #ff0055;
    color: white;
    position: absolute;
}

button:hover {
    transform: scale(1.1);
}

.hidden {
    display: none;
}

#message {
    font-size: 30px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Will You Be Mine Forever? 💖</h1>
    <button class="yes" onclick="sayYes()">Yes ❤️</button>
    <button class="no" onmouseover="moveButton()">No 😜</button>

    <div id="message" class="hidden">
        I Love You So Much 💕
    </div>
</div>

<script>
function sayYes() {
    document.getElementById("message").classList.remove("hidden");
}

function moveButton() {
    const button = document.querySelector(".no");
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
